name: check

on:
  push:
    branches:
      - master
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Test
        run: |
          python3 -m unittest discover -s tests -v
          python3 -m py_compile audit_code.py bench.py compare.py configure.py receipt.py report.py rigmark
